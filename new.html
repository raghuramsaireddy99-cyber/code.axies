<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Axis Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f0f2f8;
  --card: #ffffff;
  --primary: #4f46e5;
  --primary-light: #eef2ff;
  --success: #22c55e;
  --success-light: #dcfce7;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --text: #111827;
  --muted: #6b7280;
  --border: #e5e7eb;
  --shadow: 0 4px 24px rgba(0,0,0,0.06);
  --radius: 18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
}

h1, h2, h3, h4, h5, .fw-bold {
  font-family: 'Syne', sans-serif;
}

/* LAYOUT */
.page-wrapper { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

/* SECTION HEADER */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.5px;
}

/* CARD BOX */
.card-box {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
  margin-bottom: 40px;
}

/* INPUTS */
.form-control, .form-select {
  height: 44px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  transition: border-color 0.2s;
}
.form-control:focus, .form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
}

/* BADGES */
.status-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  font-family: 'Syne', sans-serif;
}
.badge-active   { background: var(--success-light); color: var(--success); }
.badge-working  { background: var(--primary-light); color: var(--primary); }
.badge-pending  { background: var(--warning-light); color: var(--warning); }

/* ACTION BUTTONS */
.action-btn {
  border: none;
  width: 34px; height: 34px;
  border-radius: 9px;
  background: #f3f4f6;
  color: var(--muted);
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, transform 0.15s;
  display: inline-flex; align-items: center; justify-content: center;
}
.action-btn:hover { background: var(--primary); color: #fff; transform: scale(1.08); }
.action-btn.danger:hover { background: var(--danger); color: #fff; }

/* TABLE */
.table thead th {
  font-family: 'Syne', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  border-bottom: 2px solid var(--border);
  padding: 12px 16px;
}
.table tbody td { padding: 14px 16px; vertical-align: middle; border-color: #f3f4f6; }
.table tbody tr { transition: background 0.15s; }
.table tbody tr:hover { background: #fafafa; }

/* BUTTONS */
.btn { font-family: 'Syne', sans-serif; font-weight: 600; border-radius: 10px; font-size: 0.88rem; }
.btn-primary { background: var(--primary); border-color: var(--primary); }
.btn-primary:hover { background: #4338ca; border-color: #4338ca; }

/* ============================================================
   PROJECT CARDS
   ============================================================ */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 22px;
}

.project-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  transition: transform 0.25s, box-shadow 0.25s;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.project-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); }

/* Color accent strip */
.project-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}
.accent-indigo::before { background: linear-gradient(90deg, #4f46e5, #818cf8); }
.accent-emerald::before { background: linear-gradient(90deg, #10b981, #6ee7b7); }
.accent-amber::before { background: linear-gradient(90deg, #f59e0b, #fcd34d); }
.accent-rose::before { background: linear-gradient(90deg, #ef4444, #fca5a5); }
.accent-sky::before { background: linear-gradient(90deg, #0ea5e9, #7dd3fc); }
.accent-violet::before { background: linear-gradient(90deg, #8b5cf6, #c4b5fd); }

/* Card header */
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.card-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.icon-indigo  { background: var(--primary-light); color: var(--primary); }
.icon-emerald { background: var(--success-light); color: var(--success); }
.icon-amber   { background: var(--warning-light); color: var(--warning); }
.icon-rose    { background: var(--danger-light); color: var(--danger); }
.icon-sky     { background: #e0f2fe; color: #0ea5e9; }
.icon-violet  { background: #ede9fe; color: #8b5cf6; }

.card-menu-btn {
  border: none; background: transparent; color: var(--muted);
  cursor: pointer; padding: 4px; border-radius: 6px;
  transition: background 0.2s;
}
.card-menu-btn:hover { background: #f3f4f6; }

/* Card body */
.card-title-text {
  font-family: 'Syne', sans-serif;
  font-size: 1.05rem;
  font-weight: 800;
  margin-bottom: 4px;
  letter-spacing: -0.3px;
}
.card-desc {
  font-size: 0.83rem;
  color: var(--muted);
  margin-bottom: 16px;
  line-height: 1.5;
}

/* Tags */
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tag {
  font-size: 0.72rem;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  background: #f3f4f6;
  color: var(--muted);
}

/* Team avatars */
.team-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.avatar-stack { display: flex; }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid #fff;
  margin-left: -8px;
  font-size: 0.65rem;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif;
  color: #fff;
}
.avatar:first-child { margin-left: 0; }
.avatar-1 { background: #4f46e5; }
.avatar-2 { background: #22c55e; }
.avatar-3 { background: #f59e0b; }
.avatar-4 { background: #ef4444; }
.avatar-5 { background: #0ea5e9; }
.avatar-6 { background: #8b5cf6; }

.due-label {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 500;
}
.due-date {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text);
  font-family: 'Syne', sans-serif;
}

/* Progress */
.progress-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 6px;
}
.progress-label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.progress-pct   { font-size: 0.8rem; font-weight: 700; font-family: 'Syne', sans-serif; }
.prog-bar {
  height: 7px;
  background: #f3f4f6;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 18px;
}
.prog-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.6s ease;
}

/* Card footer */
.card-footer-row {
  display: flex; gap: 8px;
  border-top: 1px solid var(--border);
  padding-top: 16px;
  margin-top: auto;
}
.card-footer-row .btn { flex: 1; font-size: 0.8rem; padding: 8px; }
.btn-outline-muted {
  border: 1.5px solid var(--border);
  color: var(--muted);
  background: transparent;
}
.btn-outline-muted:hover { background: #f3f4f6; color: var(--text); border-color: #d1d5db; }

/* Stats row on cards */
.stat-chips { display: flex; gap: 12px; margin-bottom: 14px; }
.stat-chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.75rem; color: var(--muted);
}
.stat-chip i { font-size: 0.8rem; }

/* ============================================================
   ADD PROJECT FORM (collapsible)
   ============================================================ */
.add-project-form {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
  margin-bottom: 28px;
  display: none;
}
.add-project-form.open { display: block; animation: slideDown 0.2s ease; }
@keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

/* MODALS */
.modal-content { border-radius: 18px !important; border: none; }
.modal-header  { border-bottom: 1px solid var(--border); padding: 20px 24px; }
.modal-footer  { border-top: 1px solid var(--border); padding: 16px 24px; }
.modal-body    { padding: 24px; }
.modal-title   { font-family: 'Syne', sans-serif; font-weight: 800; }

/* PROJECT VIEW MODAL */
.pv-header { position: relative; padding: 28px 28px 20px; }
.pv-accent {
  position: absolute; top: 0; left: 0; right: 0; height: 5px;
  border-radius: 18px 18px 0 0;
}
.pv-title { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
.pv-desc  { color: var(--muted); font-size: 0.9rem; }

.detail-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.detail-chip {
  background: #f8f9fb;
  border-radius: 10px;
  padding: 10px 16px;
  flex: 1; min-width: 120px;
}
.detail-chip .dc-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.detail-chip .dc-value { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; }

.task-list { list-style: none; padding: 0; }
.task-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #f3f4f6;
  font-size: 0.88rem;
  cursor: pointer;
}
.task-item:last-child { border-bottom: none; }
.task-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
.task-item.done span { text-decoration: line-through; color: var(--muted); }

.activity-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 8px 0;
  font-size: 0.83rem;
}
.activity-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
}

/* EMPTY STATE */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--muted);
}
.empty-state i { font-size: 2.5rem; opacity: 0.3; display: block; margin-bottom: 12px; }
.empty-state p { font-size: 0.9rem; }

/* Responsive */
@media (max-width: 640px) {
  .page-wrapper { padding: 20px 14px; }
  .projects-grid { grid-template-columns: 1fr; }
  .section-header { flex-direction: column; align-items: flex-start; gap: 12px; }
}
</style>
</head>
<body>

<div class="page-wrapper">

  <!-- ==================== EMPLOYEE TABLE ==================== -->
  <div class="card-box mb-5">

    <div class="section-header">
      <div class="section-title">Employee Directory</div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#employeeModal">
          <i class="bi bi-plus-circle me-1"></i>Add Employee
        </button>
        <button class="btn btn-warning btn-sm" onclick="openEditModal()">
          <i class="bi bi-pencil-square me-1"></i>Edit Employee
        </button>
      </div>
    </div>

    <div class="row g-2 mb-4">
      <div class="col-md-5">
        <input type="text" id="search" class="form-control" placeholder="🔍  Search employee...">
      </div>
      <div class="col-md-3">
        <select id="department" class="form-select">
          <option value="all">All Departments</option>
          <option value="ui design">UI Design</option>
          <option value="frontend">Frontend</option>
          <option value="backend">Backend</option>
          <option value="developer">Developer</option>
        </select>
      </div>
      <div class="col-md-4">
        <select id="status" class="form-select">
          <option value="all">All Status</option>
          <option value="active">Active</option>
          <option value="working">Working</option>
          <option value="pending">Pending</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Status</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr data-name="sangeetha" data-dept="ui design" data-status="active">
            <td><strong>Sangeetha</strong></td>
            <td>UI Design</td>
            <td><span class="status-badge badge-active">Active</span></td>
            <td>sangeetha@gmail.com</td>
            <td class="d-flex gap-1">
              <button class="action-btn" onclick="viewRow(this)" title="View"><i class="bi bi-eye"></i></button>
              <button class="action-btn" onclick="editEmployee(this)" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="action-btn danger" onclick="deleteRow(this)" title="Delete"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
          <tr data-name="praveen" data-dept="frontend" data-status="working">
            <td><strong>Praveen</strong></td>
            <td>Frontend</td>
            <td><span class="status-badge badge-working">Working</span></td>
            <td>praveen@gmail.com</td>
            <td class="d-flex gap-1">
              <button class="action-btn" onclick="viewRow(this)" title="View"><i class="bi bi-eye"></i></button>
              <button class="action-btn" onclick="editEmployee(this)" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="action-btn danger" onclick="deleteRow(this)" title="Delete"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
          <tr data-name="raghuram" data-dept="developer" data-status="pending">
            <td><strong>Raghuram</strong></td>
            <td>Developer</td>
            <td><span class="status-badge badge-pending">Pending</span></td>
            <td>raghu@gmail.com</td>
            <td class="d-flex gap-1">
              <button class="action-btn" onclick="viewRow(this)" title="View"><i class="bi bi-eye"></i></button>
              <button class="action-btn" onclick="editEmployee(this)" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="action-btn danger" onclick="deleteRow(this)" title="Delete"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>


  <!-- ==================== PROJECT CARDS ==================== -->
  <div class="section-header">
    <div class="section-title">Projects</div>
    <div class="d-flex gap-2">
      <select id="projectFilter" class="form-select form-select-sm" style="width:auto" onchange="renderProjects()">
        <option value="all">All Status</option>
        <option value="In Progress">In Progress</option>
        <option value="Review">Review</option>
        <option value="Completed">Completed</option>
        <option value="On Hold">On Hold</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="toggleAddProjectForm()">
        <i class="bi bi-plus-circle me-1"></i>New Project
      </button>
    </div>
  </div>

  <!-- ADD PROJECT FORM -->
  <div class="add-project-form" id="addProjectForm">
    <h6 class="fw-bold mb-3" style="font-family:'Syne',sans-serif;">Create New Project</h6>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-bold" style="font-size:0.82rem;">Project Name *</label>
        <input type="text" id="pName" class="form-control" placeholder="e.g. Mobile App Redesign">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold" style="font-size:0.82rem;">Description *</label>
        <input type="text" id="pDesc" class="form-control" placeholder="Short description">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold" style="font-size:0.82rem;">Status</label>
        <select id="pStatus" class="form-select">
          <option value="In Progress">In Progress</option>
          <option value="Review">Review</option>
          <option value="Completed">Completed</option>
          <option value="On Hold">On Hold</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold" style="font-size:0.82rem;">Due Date</label>
        <input type="date" id="pDue" class="form-control">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold" style="font-size:0.82rem;">Progress (%)</label>
        <input type="number" id="pProgress" class="form-control" min="0" max="100" value="0" placeholder="0-100">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold" style="font-size:0.82rem;">Tags (comma-separated)</label>
        <input type="text" id="pTags" class="form-control" placeholder="e.g. React, API, Design">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold" style="font-size:0.82rem;">Team Members (names, comma-separated)</label>
        <input type="text" id="pTeam" class="form-control" placeholder="e.g. Alice, Bob, Carol">
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" onclick="addProject()"><i class="bi bi-check2 me-1"></i>Create Project</button>
      <button class="btn btn-outline-secondary" onclick="toggleAddProjectForm()">Cancel</button>
    </div>
  </div>

  <!-- PROJECTS GRID -->
  <div class="projects-grid" id="projectsGrid"></div>

</div><!-- /page-wrapper -->


<!-- ==================== ADD EMPLOYEE MODAL ==================== -->
<div class="modal fade" id="employeeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-plus me-2 text-primary"></i>Add Employee</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><input type="text" id="empName" class="form-control" placeholder="Full Name"></div>
        <div class="mb-3"><input type="email" id="empEmail" class="form-control" placeholder="Email Address"></div>
        <div class="mb-3">
          <select id="empDept" class="form-select">
            <option value="ui design">UI Design</option>
            <option value="frontend">Frontend</option>
            <option value="backend">Backend</option>
            <option value="developer">Developer</option>
          </select>
        </div>
        <select id="empStatus" class="form-select">
          <option value="active">Active</option>
          <option value="working">Working</option>
          <option value="pending">Pending</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="addEmployee()"><i class="bi bi-plus me-1"></i>Add Employee</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== EDIT EMPLOYEE MODAL ==================== -->
<div class="modal fade" id="editEmployeeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pencil-square me-2 text-warning"></i>Edit Employee</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <select id="editSelectEmployee" class="form-select">
            <option value="">— Select Employee —</option>
          </select>
        </div>
        <div class="mb-3"><input type="text" id="editName" class="form-control" placeholder="Full Name"></div>
        <div class="mb-3"><input type="email" id="editEmail" class="form-control" placeholder="Email Address"></div>
        <div class="mb-3">
          <select id="editDept" class="form-select">
            <option value="ui design">UI Design</option>
            <option value="frontend">Frontend</option>
            <option value="backend">Backend</option>
            <option value="developer">Developer</option>
          </select>
        </div>
        <select id="editStatus" class="form-select">
          <option value="active">Active</option>
          <option value="working">Working</option>
          <option value="pending">Pending</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning" onclick="updateEmployee()"><i class="bi bi-check2 me-1"></i>Update</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== VIEW PROJECT MODAL ==================== -->
<div class="modal fade" id="projectModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-body p-0" id="projectModalBody">
        <!-- dynamically filled -->
      </div>
    </div>
  </div>
</div>

<!-- ==================== EDIT PROJECT MODAL ==================== -->
<div class="modal fade" id="editProjectModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pencil-square me-2 text-warning"></i>Edit Project</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="epId">
        <div class="mb-3"><label class="form-label" style="font-size:0.82rem;font-weight:600;">Project Name</label>
          <input type="text" id="epName" class="form-control"></div>
        <div class="mb-3"><label class="form-label" style="font-size:0.82rem;font-weight:600;">Description</label>
          <input type="text" id="epDesc" class="form-control"></div>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label" style="font-size:0.82rem;font-weight:600;">Status</label>
            <select id="epStatus" class="form-select">
              <option>In Progress</option><option>Review</option><option>Completed</option><option>On Hold</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label" style="font-size:0.82rem;font-weight:600;">Progress (%)</label>
            <input type="number" id="epProgress" class="form-control" min="0" max="100">
          </div>
          <div class="col-12">
            <label class="form-label" style="font-size:0.82rem;font-weight:600;">Due Date</label>
            <input type="date" id="epDue" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label" style="font-size:0.82rem;font-weight:600;">Tags (comma-separated)</label>
            <input type="text" id="epTags" class="form-control">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning" onclick="saveEditProject()"><i class="bi bi-check2 me-1"></i>Save Changes</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== ADD TASK MODAL ==================== -->
<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" style="font-size:1rem;"><i class="bi bi-check2-square me-2 text-primary"></i>Add Task</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="taskProjectId">
        <input type="text" id="taskInput" class="form-control" placeholder="Task description...">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="saveTask()">Add Task</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ============================================================
   EMPLOYEE LOGIC (unchanged from original)
   ============================================================ */
const search = document.getElementById("search");
const dept   = document.getElementById("department");
const status = document.getElementById("status");

function filterTable(){
  document.querySelectorAll("#tableBody tr").forEach(row => {
    let match = row.dataset.name.includes(search.value.toLowerCase()) &&
                (dept.value==="all" || row.dataset.dept===dept.value) &&
                (status.value==="all" || row.dataset.status===status.value);
    row.style.display = match ? "" : "none";
  });
}
search.addEventListener("input", filterTable);
dept.addEventListener("change", filterTable);
status.addEventListener("change", filterTable);

function viewRow(btn){
  let r = btn.closest("tr");
  alert(`Name: ${r.cells[0].innerText}\nDepartment: ${r.cells[1].innerText}\nStatus: ${r.cells[2].innerText.trim()}\nEmail: ${r.cells[3].innerText}`);
}
function editEmployee(btn){
  let row = btn.closest("tr");
  let n = prompt("Edit Name", row.cells[0].innerText);
  let d = prompt("Edit Department", row.cells[1].innerText);
  let s = prompt("Edit Status (active/working/pending)", row.dataset.status);
  let e = prompt("Edit Email", row.cells[3].innerText);
  if(!n||!d||!s||!e){ alert("Update Cancelled"); return; }
  updateRowData(row,n,d,s,e);
  alert("Employee Updated");
}
function deleteRow(btn){
  let row = btn.closest("tr");
  if(confirm("Delete "+row.dataset.name+" ?")){
    row.remove(); alert("Employee Deleted");
  }
}
function addEmployee(){
  let name = document.getElementById("empName").value.trim();
  let email = document.getElementById("empEmail").value.trim();
  let department = document.getElementById("empDept").value;
  let empStatus = document.getElementById("empStatus").value;
  if(!name||!email){ alert("Please fill all fields"); return; }
  let row = document.createElement("tr");
  row.dataset.name = name.toLowerCase(); row.dataset.dept = department; row.dataset.status = empStatus;
  row.innerHTML = `
    <td><strong>${name}</strong></td>
    <td>${department}</td>
    <td><span class="status-badge ${getBadgeClass(empStatus)}">${empStatus}</span></td>
    <td>${email}</td>
    <td class="d-flex gap-1">
      <button class="action-btn" onclick="viewRow(this)"><i class="bi bi-eye"></i></button>
      <button class="action-btn" onclick="editEmployee(this)"><i class="bi bi-pencil"></i></button>
      <button class="action-btn danger" onclick="deleteRow(this)"><i class="bi bi-trash"></i></button>
    </td>`;
  document.getElementById("tableBody").appendChild(row);
  document.getElementById("empName").value=""; document.getElementById("empEmail").value="";
  bootstrap.Modal.getInstance(document.getElementById("employeeModal")).hide();
  alert("Employee Added");
}
let selectedRow=null;
function openEditModal(){
  let rows = document.querySelectorAll("#tableBody tr");
  let sel = document.getElementById("editSelectEmployee");
  sel.innerHTML = `<option value="">— Select Employee —</option>`;
  rows.forEach((r,i)=>{ sel.innerHTML += `<option value="${i}">${r.cells[0].innerText}</option>`; });
  new bootstrap.Modal(document.getElementById("editEmployeeModal")).show();
}
document.getElementById("editSelectEmployee").addEventListener("change",function(){
  let rows=document.querySelectorAll("#tableBody tr");
  selectedRow=rows[this.value];
  if(selectedRow){
    document.getElementById("editName").value=selectedRow.cells[0].innerText;
    document.getElementById("editEmail").value=selectedRow.cells[3].innerText;
    document.getElementById("editDept").value=selectedRow.dataset.dept;
    document.getElementById("editStatus").value=selectedRow.dataset.status;
  }
});
function updateEmployee(){
  if(!selectedRow){ alert("Please select employee"); return; }
  updateRowData(selectedRow,
    document.getElementById("editName").value,
    document.getElementById("editDept").value,
    document.getElementById("editStatus").value,
    document.getElementById("editEmail").value);
  bootstrap.Modal.getInstance(document.getElementById("editEmployeeModal")).hide();
  alert("Employee Updated");
}
function updateRowData(row,name,deptValue,statusValue,email){
  row.dataset.name=name.toLowerCase(); row.dataset.dept=deptValue; row.dataset.status=statusValue;
  row.cells[0].innerHTML=`<strong>${name}</strong>`;
  row.cells[1].innerText=deptValue;
  row.cells[3].innerText=email;
  row.cells[2].innerHTML=`<span class="status-badge ${getBadgeClass(statusValue)}">${statusValue}</span>`;
  filterTable();
}
function getBadgeClass(s){
  return s==="active"?"badge-active":s==="working"?"badge-working":"badge-pending";
}

/* ============================================================
   PROJECT DATA
   ============================================================ */
const ACCENTS = ["indigo","emerald","amber","rose","sky","violet"];
const ICONS   = ["bi-grid-3x3-gap","bi-phone","bi-bar-chart-line","bi-shield-check","bi-cloud-upload","bi-layers"];
const ICON_THEMES = ["icon-indigo","icon-emerald","icon-amber","icon-rose","icon-sky","icon-violet"];
const PROG_COLORS  = ["#4f46e5","#22c55e","#f59e0b","#ef4444","#0ea5e9","#8b5cf6"];

let projectIdCounter = 10;
let projects = [
  {
    id:1, name:"CRM Dashboard", desc:"Customer management system for enterprise clients",
    status:"In Progress", progress:80, due:"2025-08-15",
    tags:["React","API","Charts"], team:["SA","PR","RK"],
    accentIdx:0,
    tasks:[
      {id:1,text:"Design wireframes",done:true},
      {id:2,text:"Implement auth module",done:true},
      {id:3,text:"Customer list view",done:false},
      {id:4,text:"Analytics charts",done:false}
    ],
    activity:[
      {text:"Praveen pushed 3 commits",time:"2h ago",color:"#4f46e5"},
      {text:"Sangeetha updated designs",time:"5h ago",color:"#22c55e"},
      {text:"Status changed to In Progress",time:"1d ago",color:"#f59e0b"}
    ]
  },
  {
    id:2, name:"Mobile Banking", desc:"Secure banking application with biometric auth",
    status:"Review", progress:65, due:"2025-09-30",
    tags:["Flutter","Node.js","Security"], team:["PR","RK"],
    accentIdx:1,
    tasks:[
      {id:1,text:"UI mockups approved",done:true},
      {id:2,text:"Login & biometric",done:true},
      {id:3,text:"Transaction history",done:false},
      {id:4,text:"Push notifications",done:false}
    ],
    activity:[
      {text:"Security audit completed",time:"3h ago",color:"#22c55e"},
      {text:"Raghuram fixed login bug",time:"1d ago",color:"#4f46e5"},
      {text:"Review phase started",time:"2d ago",color:"#f59e0b"}
    ]
  },
  {
    id:3, name:"Analytics Platform", desc:"Data analytics dashboard with real-time reporting",
    status:"In Progress", progress:90, due:"2025-07-01",
    tags:["Python","D3.js","BigQuery"], team:["SA","RK","PR"],
    accentIdx:2,
    tasks:[
      {id:1,text:"Data pipeline setup",done:true},
      {id:2,text:"Dashboard layout",done:true},
      {id:3,text:"Export to PDF/CSV",done:true},
      {id:4,text:"Final QA testing",done:false}
    ],
    activity:[
      {text:"QA testing started",time:"1h ago",color:"#f59e0b"},
      {text:"All charts integrated",time:"4h ago",color:"#4f46e5"},
      {text:"Deployed to staging",time:"2d ago",color:"#22c55e"}
    ]
  }
];

/* ============================================================
   RENDER PROJECTS
   ============================================================ */
function statusBadgeHtml(s){
  const map={
    "In Progress":"badge-working","Review":"badge-active",
    "Completed":"badge-active","On Hold":"badge-pending"
  };
  const cls=map[s]||"badge-pending";
  return `<span class="status-badge ${cls}">${s}</span>`;
}

function initials(name){ return name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2); }
const AVATAR_COLORS=["avatar-1","avatar-2","avatar-3","avatar-4","avatar-5","avatar-6"];

function renderProjects(){
  const filter = document.getElementById("projectFilter").value;
  const grid   = document.getElementById("projectsGrid");
  const list   = filter==="all" ? projects : projects.filter(p=>p.status===filter);

  if(list.length===0){
    grid.innerHTML=`<div class="empty-state col-span-3" style="grid-column:1/-1">
      <i class="bi bi-folder2-open"></i>
      <p>No projects found. Create one above!</p>
    </div>`; return;
  }

  grid.innerHTML = list.map(p=>{
    const ai = p.accentIdx % ACCENTS.length;
    const accent = ACCENTS[ai];
    const icon   = ICONS[ai];
    const iconTheme = ICON_THEMES[ai];
    const progColor = PROG_COLORS[ai];

    const teamHtml = p.team.slice(0,4).map((t,i)=>
      `<div class="avatar ${AVATAR_COLORS[i%6]}" title="${t}">${t.slice(0,2).toUpperCase()}</div>`
    ).join("") + (p.team.length>4 ? `<div class="avatar" style="background:#9ca3af">+${p.team.length-4}</div>` : "");

    const tagsHtml = p.tags.map(t=>`<span class="tag">${t}</span>`).join("");

    const doneTasks = p.tasks.filter(t=>t.done).length;

    return `
    <div class="project-card accent-${accent}" id="pcard-${p.id}">
      <div class="card-top">
        <div class="card-icon ${iconTheme}"><i class="bi ${icon}"></i></div>
        <div class="d-flex align-items-center gap-2">
          ${statusBadgeHtml(p.status)}
          <button class="card-menu-btn" onclick="openEditProjectModal(${p.id})" title="Edit">
            <i class="bi bi-pencil-square"></i>
          </button>
          <button class="card-menu-btn" onclick="deleteProject(${p.id})" title="Delete" style="color:#ef4444">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

      <div class="card-title-text">${p.name}</div>
      <div class="card-desc">${p.desc}</div>

      <div class="card-tags">${tagsHtml}</div>

      <div class="stat-chips">
        <div class="stat-chip"><i class="bi bi-check2-square"></i>${doneTasks}/${p.tasks.length} tasks</div>
        <div class="stat-chip"><i class="bi bi-calendar3"></i>Due ${p.due||"—"}</div>
      </div>

      <div class="team-row">
        <div class="avatar-stack">${teamHtml}</div>
        <div>
          <div class="due-label">Progress</div>
          <div class="due-date">${p.progress}%</div>
        </div>
      </div>

      <div class="progress-row">
        <span class="progress-label">Completion</span>
        <span class="progress-pct" style="color:${progColor}">${p.progress}%</span>
      </div>
      <div class="prog-bar">
        <div class="prog-fill" style="width:${p.progress}%;background:${progColor}"></div>
      </div>

      <div class="card-footer-row">
        <button class="btn btn-outline-muted btn-sm" onclick="openAddTaskModal(${p.id})">
          <i class="bi bi-plus me-1"></i>Task
        </button>
        <button class="btn btn-primary btn-sm" onclick="viewProject(${p.id})">
          <i class="bi bi-eye me-1"></i>View Details
        </button>
      </div>
    </div>`;
  }).join("");
}

/* ============================================================
   ADD PROJECT
   ============================================================ */
function toggleAddProjectForm(){
  const f = document.getElementById("addProjectForm");
  f.classList.toggle("open");
  if(f.classList.contains("open")) f.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function addProject(){
  const name = document.getElementById("pName").value.trim();
  const desc = document.getElementById("pDesc").value.trim();
  if(!name){ alert("Project name is required"); return; }
  const rawTags = document.getElementById("pTags").value.split(",").map(t=>t.trim()).filter(Boolean);
  const rawTeam = document.getElementById("pTeam").value.split(",").map(t=>t.trim()).filter(Boolean);
  const p = {
    id: ++projectIdCounter,
    name, desc,
    status: document.getElementById("pStatus").value,
    progress: Math.min(100, Math.max(0, parseInt(document.getElementById("pProgress").value)||0)),
    due: document.getElementById("pDue").value,
    tags: rawTags.length ? rawTags : ["General"],
    team: rawTeam.length ? rawTeam : ["You"],
    accentIdx: projects.length,
    tasks: [],
    activity: [{text:`Project "${name}" created`, time:"Just now", color:"#4f46e5"}]
  };
  projects.push(p);
  renderProjects();
  // reset
  ["pName","pDesc","pTags","pTeam"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("pProgress").value="0";
  document.getElementById("addProjectForm").classList.remove("open");
}

/* ============================================================
   DELETE PROJECT
   ============================================================ */
function deleteProject(id){
  if(!confirm("Delete this project?")) return;
  projects = projects.filter(p=>p.id!==id);
  renderProjects();
}

/* ============================================================
   VIEW PROJECT MODAL
   ============================================================ */
function viewProject(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const ai = p.accentIdx % ACCENTS.length;
  const accent = ACCENTS[ai];
  const progColor = PROG_COLORS[ai];

  const tasksHtml = p.tasks.length
    ? p.tasks.map(t=>`
        <li class="task-item ${t.done?"done":""}" onclick="toggleTask(${id},${t.id})">
          <input type="checkbox" ${t.done?"checked":""} readonly>
          <span>${t.text}</span>
        </li>`).join("")
    : `<li class="task-item"><span style="color:var(--muted)">No tasks yet. Add one below.</span></li>`;

  const actHtml = p.activity.slice(0,5).map(a=>`
    <div class="activity-item">
      <div class="activity-dot" style="background:${a.color}"></div>
      <div><span style="font-size:0.83rem">${a.text}</span><br>
        <span style="font-size:0.72rem;color:var(--muted)">${a.time}</span></div>
    </div>`).join("");

  document.getElementById("projectModalBody").innerHTML = `
    <div class="pv-header">
      <div class="pv-accent" style="background:linear-gradient(90deg,${progColor},${progColor}88)"></div>
      <div class="d-flex justify-content-between align-items-start mt-2">
        <div>
          <div class="pv-title">${p.name}</div>
          <div class="pv-desc">${p.desc}</div>
        </div>
        <button class="btn-close" data-bs-dismiss="modal" style="margin-top:4px"></button>
      </div>
    </div>
    <div style="padding:0 28px 28px">
      <div class="detail-row">
        <div class="detail-chip"><div class="dc-label">Status</div><div class="dc-value">${p.status}</div></div>
        <div class="detail-chip"><div class="dc-label">Progress</div><div class="dc-value">${p.progress}%</div></div>
        <div class="detail-chip"><div class="dc-label">Due Date</div><div class="dc-value">${p.due||"—"}</div></div>
        <div class="detail-chip"><div class="dc-label">Team</div><div class="dc-value">${p.team.length} members</div></div>
      </div>

      <div class="prog-bar mb-4" style="height:10px">
        <div class="prog-fill" style="width:${p.progress}%;background:${progColor}"></div>
      </div>

      <div class="row g-4">
        <div class="col-md-6">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong style="font-family:'Syne',sans-serif;font-size:0.9rem;">Tasks</strong>
            <button class="btn btn-outline-secondary btn-sm" onclick="bootstrap.Modal.getInstance(document.getElementById('projectModal')).hide();openAddTaskModal(${id})">
              <i class="bi bi-plus"></i> Add
            </button>
          </div>
          <ul class="task-list">${tasksHtml}</ul>
        </div>
        <div class="col-md-6">
          <strong style="font-family:'Syne',sans-serif;font-size:0.9rem;" class="d-block mb-2">Activity</strong>
          ${actHtml || '<span style="color:var(--muted);font-size:0.83rem">No activity yet.</span>'}
        </div>
      </div>
    </div>`;

  new bootstrap.Modal(document.getElementById("projectModal")).show();
}

function toggleTask(projectId, taskId){
  const p = projects.find(x=>x.id===projectId);
  if(!p) return;
  const t = p.tasks.find(x=>x.id===taskId);
  if(!t) return;
  t.done = !t.done;
  // update progress automatically
  const done = p.tasks.filter(x=>x.done).length;
  p.progress = p.tasks.length ? Math.round((done/p.tasks.length)*100) : p.progress;
  p.activity.unshift({text:`Task "${t.text}" marked ${t.done?"done":"undone"}`,time:"Just now",color:PROG_COLORS[p.accentIdx%PROG_COLORS.length]});
  renderProjects();
  viewProject(projectId); // re-render modal content
}

/* ============================================================
   ADD TASK MODAL
   ============================================================ */
function openAddTaskModal(id){
  document.getElementById("taskProjectId").value = id;
  document.getElementById("taskInput").value = "";
  new bootstrap.Modal(document.getElementById("addTaskModal")).show();
}
function saveTask(){
  const id = parseInt(document.getElementById("taskProjectId").value);
  const text = document.getElementById("taskInput").value.trim();
  if(!text){ alert("Enter a task"); return; }
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const newId = p.tasks.length ? Math.max(...p.tasks.map(t=>t.id))+1 : 1;
  p.tasks.push({id:newId,text,done:false});
  p.activity.unshift({text:`New task added: "${text}"`,time:"Just now",color:"#4f46e5"});
  bootstrap.Modal.getInstance(document.getElementById("addTaskModal")).hide();
  renderProjects();
}

/* ============================================================
   EDIT PROJECT MODAL
   ============================================================ */
function openEditProjectModal(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  document.getElementById("epId").value = id;
  document.getElementById("epName").value = p.name;
  document.getElementById("epDesc").value = p.desc;
  document.getElementById("epStatus").value = p.status;
  document.getElementById("epProgress").value = p.progress;
  document.getElementById("epDue").value = p.due||"";
  document.getElementById("epTags").value = p.tags.join(", ");
  new bootstrap.Modal(document.getElementById("editProjectModal")).show();
}
function saveEditProject(){
  const id = parseInt(document.getElementById("epId").value);
  const p  = projects.find(x=>x.id===id);
  if(!p) return;
  p.name     = document.getElementById("epName").value.trim()||p.name;
  p.desc     = document.getElementById("epDesc").value.trim()||p.desc;
  p.status   = document.getElementById("epStatus").value;
  p.progress = Math.min(100,Math.max(0,parseInt(document.getElementById("epProgress").value)||0));
  p.due      = document.getElementById("epDue").value;
  p.tags     = document.getElementById("epTags").value.split(",").map(t=>t.trim()).filter(Boolean);
  p.activity.unshift({text:`Project updated`,time:"Just now",color:"#f59e0b"});
  bootstrap.Modal.getInstance(document.getElementById("editProjectModal")).hide();
  renderProjects();
}

/* ============================================================
   INIT
   ============================================================ */
renderProjects();
</script>

</body>
